plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.23'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'dev.gloved.glovedplugin'
version = '0.1.0'

// Stable jar filename without the version (GlovedPlugin.jar)
tasks.named('jar') {
    archiveFileName = 'GlovedPlugin-plain.jar'
    enabled = true
}
tasks.named('shadowJar') {
    archiveFileName = 'GlovedPlugin.jar'
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "magmaguy"
        url = "https://repo.magmaguy.com/releases"
    }
    maven {
        name = "fancyinnovations"
        url = "https://repo.fancyinnovations.com/releases"
    }
    maven {
        name = "enginehub"
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    paperweight.paperDevBundle("26.3.build.+")
    compileOnly "com.magmaguy:EliteMobs:10.9.10"
    compileOnly "org.xerial:sqlite-jdbc:3.48.0.0"
    compileOnly "net.luckperms:api:5.4"
    compileOnly "dev.aurelium:auraskills-api-bukkit:2.4.0"
    compileOnly "de.oliver:FancyHolograms:2.8.0"
    compileOnly "com.sk89q.worldguard:worldguard-bukkit:7.0.10"
}

// Mojang-mapped output for modern Paper servers (default in recent paperweight; omit explicit config for compatibility).

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.assemble {
    dependsOn(tasks.shadowJar)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
