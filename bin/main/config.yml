menu:
  title: "GlovedMenu"
  rows: 6
  items-per-row: 5
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  filler:
    enabled: true              # fill empty menu slots with a decorative pane
    material: BLACK_STAINED_GLASS_PANE
    name: " "                  # blank display name
    lore: []                   # no lore
  items:
    - material: NETHER_STAR
      name: "&b&lWarps"
      command: "warps"
    - material: GRASS_BLOCK
      name: "&3&lSpawn"
      command: "spawn"
    - material: RED_BED
      name: "&4&lHomes"
      command: "homes"
    - material: COMPASS
      name: "&2&lRTP"
      command: "rtp"
    - material: CRAFTING_TABLE
      name: "&6&lCraft"
      command: "craft"
    - material: WRITABLE_BOOK
      name: "&4&lSkills"
      command: "skills"
    - material: ENDER_CHEST
      name: "&5&lEnder Chest"
      command: "ender"
    # Anchor example (optional per item):
    # - material: BARRIER
    #   name: "&cClose"
    #   lore: ["&7Click to close"]
    #   command: "menu"
    #   enabled: true        # false hides the item without deleting it
    #   op: true             # only shown to (and clickable by) server operators
    #   anchor: bottomright   # topleft, top, topright, left, center, right, bottomleft, bottom, bottomright
    #                         # default center; items sharing an anchor arrange around it as a group
    #   offset-x: 0           # shift columns (+right / -left), clamped to 0-8
    #   offset-y: 0           # shift rows (+down / -up), clamped to menu bounds
    # Explicit slot override (optional, wins over anchor and auto-center):
    # - material: EMERALD
    #   name: "&aJobs"
    #   lore: ["&a/jobs browse"]
    #   command: "jobs browse"
    #   slot: 13
opener:
  material: CHEST
  slot: 17
  name: "&b&lMenu"
  lore: ["&aClick to Open the Menu!"]

lootr:
  enabled: true
  auto-convert: true
  containers: [CHEST, BARREL, SHULKER_BOX, MINECART_CHEST]
  per-player-loot: true
  max-tracked-chests: 50000
  disabled-worlds: []
  protection:
    prevent-break: true
    prevent-hopper: true
    prevent-explosion: true
    prevent-piston: true
    break-confirm-time: 3
    bypass-protection: true
  visuals:
    particles-enabled: true
    particle-type: VILLAGER_HAPPY
    particles-only-unlooted: true
  inventory:
    title: "&8[&6✦&8] &eLoot Chest"
    play-sound: true
  elitemobs:
    enabled: true
    mix-vanilla: true
    scale: COMBAT_LEVEL
  storage:
    auto-save-interval: 5
