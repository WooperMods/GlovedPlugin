name: GlovedPlugin
version: '0.1.0'
main: dev.gloved.glovedplugin.GlovedPlugin
api-version: '26.3'
softdepend: [FreeMinecraftModels, ResourcePackManager, PacketEvents, EliteMobs]
commands:
  gloved:
    description: GlovedPlugin admin command
    usage: /gloved <subcommand>
  lootr:
    description: Lootr admin commands
    usage: /lootr <subcommand>
permissions:
  gloved.edit:
    description: Edit the server menu in-game
    default: op
  gloved.reload:
    description: Reload the GlovedPlugin config
    default: op
  gloved.reset:
    description: Reset the GlovedPlugin config to defaults
    default: op
  gloved.lootr.admin:
    description: Admin commands for lootr module
    default: op
  gloved.lootr.bypass:
    description: Bypass lootr protection and see vanilla chests
    default: op
  gloved.lootr.use:
    description: Use lootr instanced chests
    default: true
