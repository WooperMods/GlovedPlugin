name: GlovedPlugin
version: '0.1.0'
main: dev.gloved.glovedplugin.GlovedPlugin
api-version: '26.3'
softdepend: [FreeMinecraftModels, ResourcePackManager, PacketEvents, NpcPlugin-Paper, LuckPerms, TAB, CMI, AuraSkills]
permissions:
  gloved.edit:
    description: Edit the server menu in-game
    default: op
  gloved.reload:
    description: Reload the GlovedPlugin config
    default: op
  gloved.reset:
    description: Reset the GlovedPlugin config to defaults
    default: op
  gloved.rankglyphs:
    description: Generate/apply LuckPerms rank glyph prefixes via ResourcePackManager
    default: op