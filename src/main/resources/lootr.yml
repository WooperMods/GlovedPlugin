enabled: true
auto-convert: true
containers: [CHEST, BARREL, SHULKER_BOX, MINECART_CHEST]
per-player-loot: true
max-tracked-chests: 50000
disabled-worlds: []
protection:
  prevent-break: true
  prevent-hopper: true
  prevent-explosion: true
  prevent-piston: true
  break-confirm-time: 3
  bypass-protection: true
visuals:
  particles-enabled: true
  particle-type: VILLAGER_HAPPY
  particles-only-unlooted: true
inventory:
  title: "&8[&6✦&8] &eLoot Chest"
  play-sound: true
elite:
  enabled: true
  chance: 0.08
  luck-multiplier: 0.02
  min-items: 1
  max-items: 3
  title-suffix: "&6[Elite]"
  # Chance a regular chest hides elite items
  regular-chance: 0.25
  # Hard cap for elite items in a regular chest
  regular-max-items: 5
storage:
  auto-save-interval: 5
